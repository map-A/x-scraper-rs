[package]
name = "twscrape"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "twscrape_rs"
crate-type = ["rlib"]

[[bin]]
name = "twscrape"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
reqwest = { version = "0.12", features = ["json", "cookies", "socks"] }
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"

[dev-dependencies]
pretty_assertions = "1"
